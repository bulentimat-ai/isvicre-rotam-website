name: Import public-domain Autumn Matterhorn photograph

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-matterhorn.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-verified-photo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website
        uses: actions/checkout@v4

      - name: Download and verify public-domain Autumn Matterhorn photograph
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 3 \
            --user-agent 'SwissAlpineRoutesWebsite/1.0 (info@isvicrerotam.com)' \
            --output assets/hero-matterhorn-autumn.jpg \
            'https://upload.wikimedia.org/wikipedia/commons/0/04/Autumn_Matterhorn.jpg'
          echo '197051f00003cdee3df09a887933d831b2601b5a  assets/hero-matterhorn-autumn.jpg' | sha1sum --check
          file assets/hero-matterhorn-autumn.jpg
          test "$(stat -c %s assets/hero-matterhorn-autumn.jpg)" -gt 100000

      - name: Record original image provenance
        shell: bash
        run: |
          cat > assets/hero-matterhorn-autumn-LICENSE.txt <<'EOF'
          Photograph: Autumn Matterhorn.jpg
          Description: Matterhorn seen from above Zermatt, Switzerland.
          Photographer: Alps
          Date: 2 October 2007
          Original: https://commons.wikimedia.org/wiki/File:Autumn_Matterhorn.jpg
          Original file: https://upload.wikimedia.org/wikipedia/commons/0/04/Autumn_Matterhorn.jpg
          License: Public domain, dedicated by original copyright holder (PD-self).
          License source: https://commons.wikimedia.org/wiki/File:Autumn_Matterhorn.jpg
          SHA-1 (original): 197051f00003cdee3df09a887933d831b2601b5a
          Downloaded directly from Wikimedia Commons without modification.
          EOF

      - name: Commit locally hosted Matterhorn image
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/hero-matterhorn-autumn.jpg assets/hero-matterhorn-autumn-LICENSE.txt
          if git diff --cached --quiet; then
            echo 'Already present; no changes needed.'
          else
            git commit -m 'Add verified public-domain Autumn Matterhorn photograph (Alps)'
            git push
          fi
